    <circle class="vertex-dot" cx="245.0" cy="153.3" r="3.5" fill="#ffffff" stroke="#0d1117" stroke-width="1.5" style="animation-delay: 0.30s;"/>
    <circle class="vertex-dot" cx="285.3" cy="174.7" r="3.5" fill="#ffffff" stroke="#0d1117" stroke-width="1.5" style="animation-delay: 0.38s;"/>
    <circle class="vertex-dot" cx="311.5" cy="215.0" r="3.5" fill="#ffffff" stroke="#0d1117" stroke-width="1.5" style="animation-delay: 0.46s;"/>
    <circle class="vertex-dot" cx="288.7" cy="258.7" r="3.5" fill="#ffffff" stroke="#0d1117" stroke-width="1.5" style="animation-delay: 0.54s;"/>
    <circle class="vertex-dot" cx="245.0" cy="281.5" r="3.5" fill="#ffffff" stroke="#0d1117" stroke-width="1.5" style="animation-delay: 0.62s;"/>
    <circle class="vertex-dot" cx="211.4" cy="248.6" r="3.5" fill="#ffffff" stroke="#0d1117" stroke-width="1.5" style="animation-delay: 0.70s;"/>
    <circle class="vertex-dot" cx="197.5" cy="215.0" r="3.5" fill="#ffffff" stroke="#0d1117" stroke-width="1.5" style="animation-delay: 0.78s;"/>
    <circle class="vertex-dot" cx="218.1" cy="188.1" r="3.5" fill="#ffffff" stroke="#0d1117" stroke-width="1.5" style="animation-delay: 0.86s;"/>
    <text x="245.0" y="130.0" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500">React Native</text>
    <text x="310.0" y="155.0" text-anchor="start" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500">Next.js / React</text>
    <text x="335.0" y="219.0" text-anchor="start" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500">Git</text>
    <text x="310.0" y="285.0" text-anchor="start" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500">Pentesting</text>
    <text x="245.0" y="310.0" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500">Networking</text>
    <text x="180.0" y="285.0" text-anchor="end" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500">MongoDB</text>
