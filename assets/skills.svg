      <text x="0" y="0" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Networking</text>
      <text x="415" y="0" text-anchor="end" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Infrastructure • <tspan fill="#ffffff" font-weight="600">70%</tspan></text>
      <!-- Track -->
      <rect x="0" y="8" width="415" height="6" rx="3" fill="#161b22" stroke="#21262d" stroke-width="1"/>
