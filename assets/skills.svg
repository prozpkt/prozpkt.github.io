      <text x="415" y="0" text-anchor="end" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Mobile • <tspan fill="#ffffff" font-weight="600">65%</tspan></text>
      <!-- Track -->
